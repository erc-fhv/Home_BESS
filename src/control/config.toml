[mpc]
interval_minutes = 15

[prices]
# Day-ahead price source: "entsoe" (ENTSO-E Transparency Platform, requires API key)
# or "awattar" (aWATTar API, free, no key needed, AT/DE only)
epex_source = "awattar"

[battery]
max_charge_kw = 8.0         # max = 3*4kW
max_discharge_kw = 8.0      # max = 3*4kW
capacity_kwh = 30.72        # 5.12kWh * 6
soc_min_percent = 10.0
soc_final_percent = 50.0

# 95% battery round-trip efficiency multiplied by 96% converter efficiency,
# i.e.: sqrt(0.95) * 0.96
eta_charge = 0.936
eta_discharge = 0.936
